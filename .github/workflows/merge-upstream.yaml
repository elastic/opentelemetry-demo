name: Merge Upstream PR
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare the merge and PR text without pushing, opening a PR, or sending Slack
        type: boolean
        default: true
  schedule:
    - cron: '0 9 * * 1,4'

jobs:
  create_upstream_pr:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        uses: elastic/oblt-actions/github/create-token@fd3d4bb6f88d0f957f474764b7648cd652a9fcba  # v1.42.1
        with:
          token-policy: token-policy-e96fbab0a32e

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token || github.token }}
          persist-credentials: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}

      - name: Configure git user
        if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run == 'false' }}
        uses: elastic/oblt-actions/git/setup@fd3d4bb6f88d0f957f474764b7648cd652a9fcba  # v1.42.1
        with:
          github-token: ${{ steps.get_token.outputs.token }}

      - name: Configure dry-run git user
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
        run: |
          git config user.name 'upstream-merge-dry-run'
          git config user.email 'upstream-merge-dry-run@example.invalid'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/open-telemetry/opentelemetry-demo.git
          git fetch upstream main

      - name: Prepare upstream merge
        id: prepare
        run: |
          python3 .github/scripts/prepare_upstream_merge.py \
            --base-ref origin/main \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-dir "$RUNNER_TEMP"

      - name: Push sync branch
        if: ${{ steps.prepare.outputs.has_changes == 'true' && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false') }}
        env:
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        run: git push origin "$BRANCH_NAME"

      - name: Create pull request
        id: pr
        if: ${{ steps.prepare.outputs.has_changes == 'true' && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false') }}
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
          PR_BODY_FILE: ${{ steps.prepare.outputs.body_file }}
          PR_TITLE: ${{ steps.prepare.outputs.title }}
          HAS_CONFLICTS: ${{ steps.prepare.outputs.has_conflicts }}
        run: |
          args=(--base main --head "$BRANCH_NAME" --title "$PR_TITLE" --body-file "$PR_BODY_FILE")
          if [ "$HAS_CONFLICTS" = true ]; then
            args+=(--draft)
          fi
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" "${args[@]}")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about merge conflicts
        if: ${{ steps.prepare.outputs.has_conflicts == 'true' && steps.pr.outputs.url != '' }}
        uses: elastic/oblt-actions/slack/send@fd3d4bb6f88d0f957f474764b7648cd652a9fcba  # v1.42.1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: "C0AA2B1949M"  # otel-demo-ci
          message: |
            :warning: Upstream merge conflicts in `${{ github.repository }}`.
            Draft PR: ${{ steps.pr.outputs.url }}
            Conflicting files: ${{ steps.prepare.outputs.conflict_summary }}

  notify-failure:
    needs: [create_upstream_pr]
    if: ${{ failure() && (github.event_name == 'schedule' || github.event.inputs.dry_run == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Slack notification if any error
        uses: elastic/oblt-actions/slack/send@fd3d4bb6f88d0f957f474764b7648cd652a9fcba  # v1.42.1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: "C0AA2B1949M"  # otel-demo-ci
          message: |
            :warning: Upstream merge workflow failed for `${{ github.repository }}@${{ github.ref_name }}`.

            Please check <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|the workflow run>.
