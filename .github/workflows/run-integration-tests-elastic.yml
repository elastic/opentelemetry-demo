name: Elastic Integration Tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/README.md'

permissions:
  contents: read

jobs:
  run-tests:
    name: Test
    runs-on: ubuntu-latest
    env:
      INTEGRATION_TEST_IMAGE_NAME: otel-demo-integration-tests
      UPSTREAM_TEST_IMAGE_NAME: otel-demo-upstream-integration-tests
      INTEGRATION_TEST_DEMO_VERSION: test

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest

      - name: Build images from source
        run: |
          IMAGE_NAME="$INTEGRATION_TEST_IMAGE_NAME" \
            DEMO_VERSION="$INTEGRATION_TEST_DEMO_VERSION" \
            docker compose --env-file .env --env-file .env.override \
            -f compose.yaml \
            -f compose.full.yaml \
            -f compose.observability.yaml \
            -f compose.extras.yaml \
            -f docker-compose.elastic.yml \
            build --parallel

      - name: Build upstream images from source
        run: |
          IMAGE_NAME="$UPSTREAM_TEST_IMAGE_NAME" \
            DEMO_VERSION="$INTEGRATION_TEST_DEMO_VERSION" \
            docker compose --env-file .env \
            -f compose.yaml \
            -f compose.full.yaml \
            -f compose.extras.yaml \
            -f docker-compose.upstream.yml \
            build --parallel

      - name: Verify Docker modes and .NET telemetry
        run: python3 test/elastic/docker_mode_smoke.py

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Set up helm
        uses: azure/setup-helm@v4.3.0

      - name: Install bashunit
        run: |
          curl -sSL https://bashunit.com/install.sh | bash -s bin

      - name: Run the tests
        run: |
          ./bin/bashunit --env .env.bashunit
